<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case studies — Ginci Designs</title>
<style>@import url("https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif&family=Outfit:wght@500&display=swap");

:root {
  --ink: #0a0a0a;
  --muted: #737373;
  --line: #e5e5e5;
  --paper: #ffffff;
  --accent: #059669;
  --serif: "Instrument Serif", Georgia, serif;
  --sans: "Geist", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap { width: min(720px, 100% - 48px); margin-inline: auto; }
.wrap-wide { width: min(1120px, 100% - 48px); margin-inline: auto; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); line-height: 1.4; }
.display { font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em; }
.ph { color: var(--muted); border-bottom: 1px dashed #a3a3a3; }

.topbar { display: flex; justify-content: space-between; padding: 28px 0; }

.hero { padding: 72px 0 56px; }
.eyebrow { display: flex; align-items: center; gap: 12px; }
.hero h1 { font-size: clamp(56px, 11vw, 120px); line-height: 0.95; margin: 20px 0 32px; }
.outcome { font-size: clamp(22px, 3vw, 28px); line-height: 1.35; letter-spacing: -0.01em; margin: 0; max-width: 30ch; }
.result { margin: 16px 0 0; font-size: 15px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 24px; margin: 48px 0 0; padding-top: 24px; border-top: 1px solid var(--line); }
.meta dd { margin: 6px 0 0; font-size: 15px; }

.cover { margin: 0 auto 96px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 40px 24px; padding: 0 0 96px; }
.stat { font-size: 56px; line-height: 1; margin-bottom: 10px; color: var(--ink); }
.stats > div:nth-child(3) .stat { color: var(--accent); }

.prose { padding-bottom: 72px; }
.block { display: grid; gap: 12px; padding: 32px 0; border-top: 1px solid var(--line); }
.block p { margin: 0; font-size: 19px; line-height: 1.6; }
@media (min-width: 900px) {
  .block { grid-template-columns: 0 1fr; column-gap: 0; }
  .block > .mono { position: relative; left: -180px; width: 160px; padding-top: 6px; }
}
.scope { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 32px; }
.scope li { display: flex; gap: 12px; align-items: baseline; padding: 6px 0; break-inside: avoid; }
.scope .mono { letter-spacing: 0.06em; }

.chapter { padding: 96px 0; border-top: 1px solid var(--line); }
.h2 { font-size: clamp(36px, 5.5vw, 56px); line-height: 1.05; margin: 18px 0 20px; }
.lede { font-size: 21px; line-height: 1.5; margin: 0; letter-spacing: -0.005em; }
.body { color: #404040; margin: 24px 0 0; }
.decisions { list-style: none; padding: 0; margin: 28px 0 0; }
.decisions li { padding: 12px 0 12px 28px; border-bottom: 1px solid #f0f0f0; position: relative; }
.decisions li::before { content: ""; position: absolute; left: 0; top: 23px; width: 14px; height: 1.5px; background: var(--accent); }
.badge { font-size: 10px; letter-spacing: 0.14em; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.soon { padding: 72px 0; }
.soon .h2, .soon .lede { color: #a3a3a3; }

.demo-row { display: grid; gap: 48px; margin-top: 64px; align-items: start; }
@media (min-width: 960px) { .demo-row { grid-template-columns: 1.1fr 0.9fr; } }
.demo-label { margin-bottom: 14px; color: var(--accent); }
.shot { margin: 34px 0 0; }

.next { padding: 72px 0 120px; border-top: 1px solid var(--line); }
.next a { display: inline-block; }
.next a:hover { color: var(--accent); }

@media (max-width: 600px) {
  .scope { columns: 1; }
  .chapter { padding: 72px 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.switcher { display: flex; gap: 20px; flex-wrap: wrap; justify-content: flex-end; }
.switcher a { color: var(--muted); }
.switcher a[aria-current="page"] { color: var(--ink); border-bottom: 1px solid var(--accent); }
.switcher a:hover { color: var(--ink); }
@media (max-width: 600px) { .topbar { flex-direction: column; gap: 14px; } .switcher { justify-content: flex-start; gap: 14px; } }
</style>
</head>

<div id="root"></div>

ariants across atoms, molecules and organisms \u2014 structured so the system grows by composition, not by duplication.",body:"Instead of giant variant matrices, components are assembled from small building-block sub-components. A button doesn't get a variant for every icon and size combination; it gets slots. Spacing runs on an 8pt system. Type follows one rule: labels and headers in Outfit, anything a person reads or types in Avenir. One icon library \u2014 Vuesax \u2014 and nothing hand-drawn. Responsive versions reflow with real auto-layout; scaled-down desktop frames were rejected outright.",decisions:["Building-block sub-components over variant matrices","8pt spacing system across every surface","Outfit for labels, Avenir for read and typed text","Responsive = real reflow, never scaled frames"],demo:"ComponentExplorer",image:"/assets/tranzakt/design-system.png",imageDevice:"laptop"},{id:"treasury",status:"live",eyebrow:"02 \u2014 Treasury",heading:"A treasury command centre for every account at once",summary:"Nine screens (dashboard, wallets, liquidity, transactions, payments, reconciliation, insights, reports and settings) built around one consolidated view of money across banks.",body:"The dashboard opens on the five numbers a finance team checks first: total balance, liquidity ratio, 24-hour inflows and outflows, and net position. Each has a trend line and its change since the last period. From there, every module follows one interaction model. A KPI card opens a drill-down drawer, and a transaction row opens a detail panel on the right. Anything that creates something, like a payment or a report, happens in a full-screen guided modal. Learn it once and it works the same on all nine screens.",decisions:["Five KPIs first: balance, liquidity, inflows, outflows, net","One interaction model across all nine screens","Inspect in a side drawer, create in a full-screen modal","Every insight card carries an action"],demo:"TreasuryOverview",image:"/assets/tranzakt/treasury.png",imageDevice:"laptop"},{id:"payment-gateway",status:"live",eyebrow:"03 \u2014 Checkout",heading:"A checkout that only shows the fee you'll actually pay",summary:"Card, Transfer, USSD and Bank \u2014 identical on web and mobile, with fees revealed only for the method you choose.",body:"Customers see the base amount until they pick a method. Then a small info icon opens a breakdown of that one transaction: base amount plus that channel's fee. No intimidating table of every channel's charges up front. The copy button beside the amount appears only on USSD and Transfer \u2014 the two methods where people genuinely need to copy a number into another app.",decisions:["Base amount first; fee revealed per chosen method","Tooltip shows the current transaction only","Copy affordance only where copying happens","Four methods, matched across web and mobile"],demo:"MiniCheckout",image:"/assets/tranzakt/checkout.png",imageDevice:"phone"},{id:"kyc",status:"coming-soon",eyebrow:"04 \u2014 Onboarding",heading:"One verification module for every product and user type",summary:"KYC/KYB for Personal, Business and Government users \u2014 six sections, every state mapped, one module shared across the platform.",body:"The verification module serves every Tranzakt product, so its copy never names one. Six onboarding sections specify Nigerian compliance data \u2014 BVN, NIN, CAC, SCUML \u2014 field by field. Progress-tracking widgets were removed to cut clutter, and failed documents get one clear message rather than per-document admin notes, which keeps review scalable. Each user type is mapped through success, failed submission, in review, action required, edge cases, and save & quit. Mobile uses exactly the same fields as web.",decisions:["One generic module serving every product","Tracking widgets removed","One clear failure message, not per-document notes","Mobile fields identical to web"],demo:"KycStateSwitcher",image:"/assets/tranzakt/kyc.png",imageDevice:"laptop"},{id:"merchant-ai",status:"coming-soon",eyebrow:"05 \u2014 Exploration",heading:"Merchant AI: explain, recommend, execute",summary:"Five AI pillars for merchants under one interaction model \u2014 and a rule that every insight must come with a decision.",body:"Onboarding, natural-language payment setup, tracking and insights, forecasting, and collections all follow one pattern: the AI explains what's happening, recommends what to do, and executes only when the merchant agrees. Actionable items sit above analytics; no decorative data without a decision attached. The direction is backed by a pattern study of Stripe, Mercury, Ramp, Cleo, Intuit, Lorikeet and Revolut.",decisions:["Explain \u2192 Recommend \u2192 Execute, every time","Actions above analytics","No decorative data","Grounded in a 7-product pattern study"],demo:"ExplainRecommendExecute",image:"/assets/tranzakt/merchant-ai.png",imageDevice:"laptop"}],nextSteps:["Reconcile design-system docs with ratified tokens \u2014 one canonical brand green, one confirmed font stack","Finish the remaining navigation organisms: page header, sidebar, topbar, command menu","Ship the responsive marketing site"],nextCaseStudy:"Dado Foods",nextSlug:"dado-foods"},{slug:"dado-foods",status:"live",title:"Dado Foods",client:"Dado Foods (dado.ng)",category:"Food delivery \xB7 [Product / Web / Brand design]",role:"[Product Designer]",timeline:"[Year]",team:"[Team]",accent:"#E4572E",accentNote:"[Placeholder accent. Swap for Dado's brand colour]",outcomeLine:"Food delivery across Enugu and Lagos, designed so customers [order in fewer steps] and always know where their food is.",outcomeResult:"[Add a result, e.g. orders per week, repeat customers, checkout completion]",coverImage:"/assets/dado/cover.png",stats:[{value:"2",label:"Cities: Enugu & Lagos"},{value:"[X]",label:"Screens designed"},{value:"[X]",label:"Orders per month"},{value:"[X]",label:"Menu items"}],context:"Dado Foods is a food delivery service in Nigeria, with a base in Enugu and Lagos. [Add who orders, what they order, and how they ordered before your work.]",problem:"[What wasn't working before, e.g. ordering friction, no delivery visibility, or a brand that didn't match the food.]",scope:["[Customer ordering flow]","[Order tracking]","[Website: dado.ng]","[Brand / visual identity]"],sections:[{id:"ordering",status:"live",eyebrow:"01 \u2014 Ordering",heading:"Two cities, one way to order",summary:"Enugu and Lagos share one ordering experience. Only the delivery areas and times change by city.",body:"[Describe the ordering flow you designed: menu, cart, checkout, payment, and the decisions behind it. The demo shows the tracking concept: one estimate and one plain-language status at each step. Confirm or replace it with what you actually shipped.]",decisions:["[Key decision 1]","[Key decision 2]","[Key decision 3]"],demo:"OrderTracker",image:"/assets/dado/ordering.png",imageDevice:"phone"},{id:"website",status:"coming-soon",eyebrow:"02 \u2014 Web",heading:"[The dado.ng website]",summary:"[One line on what the site does for customers]",body:"",decisions:[],demo:"",image:"/assets/dado/website.png",imageDevice:"browser"},{id:"brand",status:"coming-soon",eyebrow:"03 \u2014 Brand",heading:"[Brand & visual identity]",summary:"[One line on the look and feel, and why]",body:"",decisions:[],demo:"",image:"/assets/dado/brand.png",imageDevice:"laptop"}],nextSteps:["[What you'd improve next]"],nextCaseStudy:"NSIA",nextSlug:"nsia"},{slug:"nsia",status:"live",title:"NSIA",client:"NSIA",category:"Supply chain \xB7 Agriculture",role:"[Product Designer]",timeline:"[Year]",team:"[Team]",accent:"#4D7C0F",accentNote:"[Placeholder accent. Swap for NSIA's brand colour]",outcomeLine:"Fertiliser from development to the farm, followed on one platform [add the outcome].",outcomeResult:"[Add a result, e.g. delivery visibility, stock-out reduction, reporting time saved]",coverImage:"/assets/nsia/cover.png",stats:[{value:"[X]",label:"User roles"},{value:"[X]",label:"Scre
